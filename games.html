<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Universal | Games</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
    body{font-family:'Inter',sans-serif;background:#0F172A;color:#E2E8F0}
    ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#334155;border-radius:10px}
    .game-card{transition:transform .18s ease,box-shadow .18s ease}
    .game-card:hover{transform:translateY(-4px);box-shadow:0 15px 25px rgba(6,182,212,0.12)}
    .active-tab{ background:#0E7490;color:#fff;border-bottom:3px solid #06B6D4 }
  </style>
</head>
<body class="antialiased">

  <header class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur-sm shadow-xl border-b border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i data-lucide="zap" class="w-6 h-6 text-cyan-400"></i>
        <a href="index.html" class="text-2xl font-extrabold text-white">Universal <span class="text-cyan-400">Arcade</span></a>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-gray-300 hover:text-cyan-400">Home</a>
        <a href="play.html" class="text-gray-300 hover:text-cyan-400">Play</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 p-4 bg-gray-800 rounded-xl border border-gray-700">
      <div>
        <h1 id="page-title" class="text-2xl font-bold text-white">Games</h1>
        <p class="text-gray-400 text-sm">Browse games loaded from <code class="text-xs text-gray-300">games.json</code></p>
      </div>

      <div class="mt-4 md:mt-0 w-full md:w-80">
        <input id="search" class="w-full pl-10 pr-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400" placeholder="Search games..." />
        <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute ml-3 mt-2"></i>
      </div>
    </div>

    <!-- category tabs -->
    <div class="mb-6 border-b border-gray-700">
      <div id="tabs" class="flex space-x-2 overflow-x-auto pb-2">
        <!-- tabs injected by JS -->
      </div>
    </div>

    <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>

    <div id="no-results" class="text-center py-20 hidden">
      <i data-lucide="frown" class="w-12 h-12 text-gray-500 mx-auto mb-4"></i>
      <p class="text-xl text-gray-400">No games found matching your criteria.</p>
    </div>
  </main>

  <footer class="mt-12 py-6 text-center text-gray-500 border-t border-gray-800">
    <p>&copy; <span id="year"></span> Universal</p>
  </footer>

  <script>
    let games = [];
    let currentCategory = 'All';
    const gamesGrid = document.getElementById('games-grid');
    const noResults = document.getElementById('no-results');
    const searchInput = document.getElementById('search');

    function makePlaceholder(title){
      return `https://placehold.co/400x225/1E293B/E2E8F0?text=${encodeURIComponent(title)}`;
    }

    function renderGameCard(g){
      return `
        <a href="play.html?id=${encodeURIComponent(g.id)}" class="game-card block bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-cyan-500">
          <div class="h-28 bg-gray-700 flex items-center justify-center relative">
            <img src="${g.thumbnail || makePlaceholder(g.title)}" alt="${g.title}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center">
              <i data-lucide="${g.icon||'gamepad'}" class="w-8 h-8 text-cyan-400"></i>
            </div>
          </div>
          <div class="p-3">
            <h3 class="text-white text-sm font-semibold truncate">${g.title}</h3>
            <p class="text-gray-400 text-xs mt-1">${g.category || ''}</p>
          </div>
        </a>
      `;
    }

    function renderGames(category='All', search=''){
      const searchLower = (search||'').toLowerCase();
      const filtered = games.filter(g => {
        const catMatch = category === 'All' || (g.category || '') === category || (category === 'Featured' && (g.category||'').toLowerCase()==='featured');
        const searchMatch = !search || g.title.toLowerCase().includes(searchLower) || (g.tags && g.tags.join(' ').toLowerCase().includes(searchLower));
        return catMatch && searchMatch;
      });

      gamesGrid.innerHTML = '';
      if(!filtered.length){ noResults.classList.remove('hidden'); return; }
      noResults.classList.add('hidden');
      filtered.forEach(g => gamesGrid.insertAdjacentHTML('beforeend', renderGameCard(g)));
      lucide.createIcons();
    }

    function buildTabs(){
      const tabsEl = document.getElementById('tabs');
      const cats = Array.from(new Set(['Featured','Arcade','Racing','Puzzle','Strategy', ...games.map(g=>g.category).filter(Boolean)]));
      tabsEl.innerHTML = '';
      ['All', ...cats].forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50';
        btn.textContent = cat;
        btn.dataset.category = cat;
        if(cat===currentCategory) btn.classList.add('active-tab');
        btn.addEventListener('click', ()=> {
          currentCategory = cat;
          Array.from(document.querySelectorAll('.tab-button')).forEach(b => b.classList.remove('active-tab'));
          btn.classList.add('active-tab');
          searchInput.value = '';
          renderGames(currentCategory);
        });
        tabsEl.appendChild(btn);
      });
    }

    function readQuery(){
      const params = new URLSearchParams(location.search);
      const q = params.get('search') || '';
      if(q) searchInput.value = q;
      const cat = params.get('category');
      if(cat) currentCategory = cat;
    }

    // Load games.json
    fetch('/games.json').then(r => r.ok ? r.json() : Promise.reject('no json')).then(data => {
      games = Array.isArray(data) ? data : (data.games || []);
      buildTabs();
      readQuery();
      renderGames(currentCategory, searchInput.value || '');
    }).catch(err => {
      // fallback: small demo set
      games = [
        {id:1,title:'Demo Shooter',category:'Arcade',icon:'rocket'},
        {id:2,title:'Demo Racer',category:'Racing',icon:'car'}
      ];
      buildTabs(); renderGames();
    });

    // Search behavior
    searchInput.addEventListener('input', ()=> {
      renderGames('All', searchInput.value);
      // when searching remove active tab highlight
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active-tab'));
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', ()=> {
      lucide.createIcons();
      document.getElementById('year').textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
