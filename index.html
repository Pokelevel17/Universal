<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Hub | Unblocked Games Portal</title>
    <!-- Load Tailwind CSS for a modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons for aesthetic appeal -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom styles and configuration */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A; /* Slate 900 base */
            color: #E2E8F0; /* Slate 200 for general text */
            min-height: 100vh;
        }

        /* Customize scrollbar for a dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155; /* Slate 700 */
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569; /* Slate 600 */
        }

        .game-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(6, 182, 212, 0.2); /* Cyan glow on hover */
            border-color: #06B6D4; /* Cyan 500 */
        }

        .tab-button {
            transition: all 0.3s ease;
        }
        
        .active-tab {
            background-color: #0E7490; /* Cyan 700 */
            color: white;
            border-bottom: 3px solid #06B6D4; /* Cyan 500 */
        }

        /* Full screen game view specific styles */
        #game-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background-color: #000;
            display: none; /* Hidden by default */
            flex-direction: column;
        }

        #game-iframe {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body class="antialiased">

    <!-- Header / Navigation Bar -->
    <header id="main-header" class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur-sm shadow-xl border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <!-- Logo / Title -->
            <div class="flex items-center space-x-2">
                <i data-lucide="zap" class="w-6 h-6 text-cyan-400"></i>
                <span class="text-2xl font-extrabold text-white">Quantum<span class="text-cyan-400">Hub</span></span>
            </div>

            <!-- Nav Links -->
            <nav class="hidden sm:flex space-x-6">
                <a href="#" class="text-gray-300 hover:text-cyan-400 transition duration-150 font-medium">Home</a>
                <a href="#games" class="text-gray-300 hover:text-cyan-400 transition duration-150 font-medium">Games</a>
                <a href="#apps" class="text-gray-300 hover:text-cyan-400 transition duration-150 font-medium">Apps</a>
                <a href="#about" class="text-gray-300 hover:text-cyan-400 transition duration-150 font-medium">About</a>
            </nav>
            
            <!-- Mobile Menu Button (Placeholder) -->
            <button class="sm:hidden text-gray-300 hover:text-cyan-400">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </header>

    <!-- --- 1. DASHBOARD VIEW (Game Selection) --- -->
    <div id="dashboard-view">
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

            <!-- Search Bar and Greeting -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 p-6 bg-gray-800 rounded-xl shadow-lg border border-gray-700">
                <div>
                    <h1 class="text-3xl font-bold text-white mb-1">Welcome Back.</h1>
                    <p class="text-gray-400">Dive into thousands of unblocked titles instantly.</p>
                </div>

                <div class="relative w-full md:w-80 mt-4 md:mt-0">
                    <input type="text" id="search-input" placeholder="Search for games..." class="w-full pl-10 pr-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-cyan-500 focus:border-cyan-500 text-white placeholder-gray-400" onkeyup="filterGames()">
                    <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                </div>
            </div>

            <!-- Category Tabs -->
            <div class="mb-8 border-b border-gray-700">
                <div class="flex space-x-2 overflow-x-auto pb-2">
                    <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="All">All Games</button>
                    <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50 active-tab" data-category="Featured">Featured</button>
                    <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Arcade">Arcade</button>
                    <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Racing">Racing</button>
                    <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Puzzle">Puzzle</button>
                    <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Strategy">Strategy</button>
                </div>
            </div>

            <!-- Games Grid Container -->
            <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 gap-6">
                <!-- Game cards will be injected here by JavaScript -->
            </div>

            <!-- No Results Message -->
            <div id="no-results" class="text-center py-20 hidden">
                <i data-lucide="frown" class="w-12 h-12 text-gray-500 mx-auto mb-4"></i>
                <p class="text-xl text-gray-400">No games found matching your criteria. Try another search or category!</p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="mt-20 py-6 text-center text-gray-500 border-t border-gray-800">
            <p>&copy; 2025 Quantum Hub. Made with <span class="text-red-500">♥</span> | Powered by Fusionzzz</p>
        </footer>
    </div>


    <!-- --- 2. GAME VIEW (IFrame Launcher) --- -->
    <div id="game-view">
        <div class="p-4 bg-gray-900 flex justify-between items-center shadow-lg w-full">
            <h2 id="game-title" class="text-xl font-semibold text-white truncate">Loading Game...</h2>
            <button onclick="exitGame()" class="flex items-center space-x-2 text-red-400 hover:text-red-300 p-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition duration-150">
                <i data-lucide="x-circle" class="w-5 h-5"></i>
                <span class="hidden sm:inline">Exit Game</span>
            </button>
        </div>
        
        <!-- The Iframe where the game content will load -->
        <!-- NOTE: In a real deployment, you would point the 'src' to your game file or proxy endpoint. -->
        <iframe id="game-iframe" sandbox="allow-scripts allow-same-origin allow-popups allow-pointer-lock allow-forms"></iframe>
    </div>

<script>
    // Initialize Lucide Icons after the DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
    });

    // --- DOM Elements ---
    const gamesGrid = document.getElementById('games-grid');
    const noResults = document.getElementById('no-results');
    const dashboardView = document.getElementById('dashboard-view');
    const gameView = document.getElementById('game-view');
    const gameIframe = document.getElementById('game-iframe');
    const gameTitleElement = document.getElementById('game-title');
    const header = document.getElementById('main-header');

    let currentCategory = 'Featured'; // Default category
    let allGames = []; // Will be populated by fetch

    // --- Data Fetching Logic ---
    async function fetchGames() {
        try {
            // Fetch the games.json file located in the same directory
            const response = await fetch('games.json');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}. Check if 'games.json' exists.`);
            }
            // Populate the global allGames array
            allGames = await response.json();
            console.log("Game data loaded successfully.");
        } catch (error) {
            console.error("Could not fetch game data:", error);
            // Display a message if data loading fails
            gamesGrid.innerHTML = `<div class="col-span-full text-center py-10 text-red-400 bg-gray-800 rounded-lg p-6">
                <p class="font-bold">Error Loading Games</p>
                <p>Could not load games.json. Please ensure the file exists and is accessible.</p>
            </div>`;
        }
    }
    
    // --- Game Card Renderer ---
    function renderGameCard(game) {
        // Simple mock image placeholder URL
        const placeholderUrl = `https://placehold.co/400x225/1E293B/E2E8F0?text=${game.title.replace(/\s/g, '+')}`;

        return `
            <a href="#" onclick="launchGame(event, '${game.title}', '${game.url}')" class="game-card block bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-cyan-500 shadow-xl">
                <!-- Image Placeholder -->
                <div class="h-28 bg-gray-700 flex items-center justify-center relative">
                    <img src="${placeholderUrl}" alt="${game.title} placeholder" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.querySelector('div').classList.remove('hidden');">
                    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center">
                        <i data-lucide="${game.icon}" class="w-10 h-10 text-cyan-400"></i>
                    </div>
                </div>
                <!-- Details -->
                <div class="p-3">
                    <h3 class="text-white text-base font-semibold truncate">${game.title}</h3>
                    <p class="text-gray-400 text-xs mt-1 capitalize">${game.category}</p>
                </div>
            </a>
        `;
    }

    // --- Main Rendering Logic ---
    function renderGames(category, searchTerm = '') {
        // Ensure allGames is loaded before attempting to render
        if (allGames.length === 0 && searchTerm === '') {
            // If the array is empty and we aren't searching, it means we're waiting on the fetch or it failed.
            return; 
        }

        const gamesToFilter = category === 'Featured' ? allGames.filter(g => g.category === 'Featured') : allGames;

        const filteredGames = gamesToFilter.filter(game => {
            const categoryMatch = category === 'All' || category === game.category;
            const searchMatch = searchTerm === '' || game.title.toLowerCase().includes(searchTerm.toLowerCase());
            return categoryMatch && searchMatch;
        });

        gamesGrid.innerHTML = '';

        if (filteredGames.length === 0) {
            noResults.classList.remove('hidden');
        } else {
            noResults.classList.add('hidden');
            filteredGames.forEach(game => {
                gamesGrid.insertAdjacentHTML('beforeend', renderGameCard(game));
            });
            lucide.createIcons();
        }
    }

    // --- Tab Switching Logic ---
    function switchCategory(newCategory) {
        currentCategory = newCategory;
        const buttons = document.querySelectorAll('.tab-button');
        
        buttons.forEach(button => {
            if (button.dataset.category === newCategory) {
                button.classList.add('active-tab');
            } else {
                button.classList.remove('active-tab');
            }
        });
        
        // Clear search input when switching tabs
        document.getElementById('search-input').value = '';
        renderGames(currentCategory);
    }
    
    // --- Search Filtering Logic ---
    function filterGames() {
        const searchTerm = document.getElementById('search-input').value;
        // Search ignores the current category filter and searches across all games
        renderGames('All', searchTerm);

        // Remove active class from all tab buttons during search
        document.querySelectorAll('.tab-button').forEach(button => {
            button.classList.remove('active-tab');
        });
    }

    // --- Game Launching Functions ---
    function launchGame(event, gameTitle, gameUrl) {
        event.preventDefault(); // Stop the default link behavior
        
        // Hide the dashboard and header
        dashboardView.style.display = 'none';
        header.style.display = 'none';
        
        // Show the game view
        gameView.style.display = 'flex';
        
        // Update the game iframe and title
        gameTitleElement.textContent = gameTitle;
        gameIframe.src = gameUrl;

        // Ensure icons on the game view button are created
        lucide.createIcons();
    }

    function exitGame() {
        // Clear the iframe source to stop any running game content
        gameIframe.src = 'about:blank';
        
        // Hide the game view
        gameView.style.display = 'none';

        // Show the dashboard and header
        dashboardView.style.display = 'block';
        // Note: setting display to 'sticky' doesn't work; 'block' or '' is safer for general visibility
        header.style.display = 'block'; 
    }

    // --- Initialization function (Async) ---
    async function initApp() {
        // 1. Fetch data from JSON file
        await fetchGames();
        
        // 2. Start with the 'Featured' tab selected and render the games
        switchCategory(currentCategory); 
    }

    // --- Event Listeners and Initialization ---
    document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', () => {
            switchCategory(button.dataset.category);
        });
    });

    // Initialize the dashboard on load
    window.onload = () => {
        initApp();
    };
</script>

</body>
</html>
