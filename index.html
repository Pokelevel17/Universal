<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Arcade</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #E2E8F0; min-height: 100vh; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .game-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .game-card:hover { transform: translateY(-4px); box-shadow: 0 15px 25px rgba(6,182,212,0.2); border-color: #06B6D4; }
    .tab-button { transition: all 0.3s ease; }
    .active-tab { background-color: #0E7490; color: white; border-bottom: 3px solid #06B6D4; }
    .chat-messages { overflow-y: auto; }
    .citation { font-size: 0.7rem; color: #67E8F9; text-decoration: underline; margin-top: 5px; display: block; }
</style>
</head>
<body class="antialiased">

<!-- Header / Navigation Bar -->
<header class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur-sm shadow-xl border-b border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
        <!-- Logo / Title -->
        <div class="flex items-center space-x-2">
            <i data-lucide="zap" class="w-6 h-6 text-cyan-400"></i>
            <span class="text-2xl font-extrabold text-white">Universal<span class="text-cyan-400">Arcade</span></span>
        </div>

        <!-- Proxy and Game Suggestions Buttons -->
        <div class="flex space-x-2">
            <a href="proxy.html"
               class="flex items-center justify-center py-2 px-4 bg-cyan-600 text-white text-sm font-semibold rounded-lg shadow-lg hover:bg-cyan-500 transition duration-150 ease-in-out">
                <i data-lucide="globe" class="w-5 h-5 mr-2"></i>
                <span>Open Proxy</span>
            </a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfGZL6dP1snuieVUR9V0rjWzOGhx7oK3t5O0kG_S5gDAw6ZIg/viewform?usp=header"
               target="_blank"
               class="flex items-center justify-center py-2 px-4 bg-cyan-600 text-white text-sm font-semibold rounded-lg shadow-lg hover:bg-cyan-500 transition duration-150 ease-in-out">
                <i data-lucide="send" class="w-5 h-5 mr-2"></i>
                <span>Game Suggestions</span>
            </a>
        </div>
    </div>
</header>

<!-- Main Content Area -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Game Grid View -->
    <div id="game-grid-view">

        <!-- Greeting -->
        <div class="mb-10 p-6 bg-gray-800 rounded-xl shadow-lg border border-gray-700">
            <h1 class="text-3xl font-bold text-white mb-1">Welcome To Universal Arcade!</h1>
            <p class="text-gray-400">One of the best unblocked game websites with a ton of games and gets updated weekly!</p>
        </div>

        <!-- Category Tabs -->
        <div class="mb-8 border-b border-gray-700">
            <div class="flex space-x-2 overflow-x-auto pb-2">
                <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="All">All Games</button>
                <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50 active-tab" data-category="HTML5">HTML5</button>
                <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Emulator">Emulator</button>
                <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Ruffle">Ruffle</button>
                <button class="tab-button px-5 py-2 rounded-t-lg text-sm font-semibold text-gray-400 hover:bg-gray-700/50" data-category="Scratch">Scratch</button>
            </div>
        </div>

        <!-- Games Grid Container -->
        <div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 gap-6"></div>

        <!-- No Results Message -->
        <div id="no-results" class="text-center py-20 hidden">
            <i data-lucide="frown" class="w-12 h-12 text-gray-500 mx-auto mb-4"></i>
            <p class="text-xl text-gray-400">No games found... Try searching something else!</p>
        </div>

    </div>
</main>

<!-- Footer -->
<footer class="mt-20 py-6 text-center text-gray-500 border-t border-gray-800">
    <p>&copy; 2025 Universal Arcade. Made by Fusionzzz</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

let allGames = [], currentCategory = 'Featured';
const gamesGrid = document.getElementById('games-grid'), noResults = document.getElementById('no-results');

function loadGames() {
    fetch('games.json')
        .then(res => res.json())
        .then(data => { allGames = data; renderGames(currentCategory); })
        .catch(err => { console.error(err); allGames = []; renderGames(currentCategory); });
}

function renderGameCard(game){
    const placeholderUrl=`https://placehold.co/400x225/1E293B/E2E8F0?text=${encodeURIComponent(game.title)}`;
    return `<div onclick="startGame('${game.url}','${game.title.replace(/'/g,"\\'")}')" class="game-card block bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-cyan-500 shadow-xl cursor-pointer">
                <div class="h-28 bg-gray-700 flex items-center justify-center relative">
                    <img src="${game.image||placeholderUrl}" alt="${game.title}" class="w-full h-full object-cover" onerror="this.src='${placeholderUrl}'">
                    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center">
                        <i data-lucide="${game.icon||'gamepad'}" class="w-10 h-10 text-cyan-400"></i>
                    </div>
                </div>
                <div class="p-3">
                    <h3 class="text-white text-base font-semibold truncate">${game.title}</h3>
                    <p class="text-gray-400 text-xs mt-1 capitalize">${game.category}</p>
                </div>
            </div>`;
}

function renderGames(category, searchTerm='') {
    const filteredGames = allGames.filter(game=>{
        const catMatch = category==='All'||game.category===category||(category==='Featured'&&game.category==='Featured');
        const searchMatch = game.title.toLowerCase().includes(searchTerm.toLowerCase());
        return catMatch && searchMatch;
    });
    gamesGrid.innerHTML='';
    if(filteredGames.length===0){ noResults.classList.remove('hidden'); }
    else{ noResults.classList.add('hidden'); filteredGames.forEach(game=>gamesGrid.insertAdjacentHTML('beforeend',renderGameCard(game))); lucide.createIcons();}
}

function switchCategory(newCategory){
    currentCategory=newCategory;
    document.querySelectorAll('.tab-button').forEach(btn=>btn.classList.toggle('active-tab',btn.dataset.category===newCategory));
    renderGames(currentCategory);
}

document.querySelectorAll('.tab-button').forEach(btn=>btn.addEventListener('click',()=>switchCategory(btn.dataset.category)));
window.onload=()=>loadGames();
</script>
</body>
</html>
